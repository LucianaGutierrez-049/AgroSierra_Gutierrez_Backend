name: agrosierra-gutierrez
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: agrosierra-oracle
    ports:
      - "127.0.0.1:1523:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-AgroOracle2026_Dev}
      APP_USER: AGRODB
      APP_USER_PASSWORD: ${DB_PASSWORD:-AgroDb2026_Dev}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: AGRODB
      DB_PASSWORD: ${DB_PASSWORD:-AgroDb2026_Dev}
      JWT_SECRET: ${JWT_SECRET:-agrosierra-desarrollo-local-cambiar-antes-de-publicar-2026}
    depends_on:
      oracle:
        condition: service_healthy
volumes:
  oracle-data:
